<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BET ANALYST — P3.2-B local</title><style>body{font:16px system-ui;max-width:700px;margin:auto;padding:16px;color:#17324d}header{background:#17324d;color:white;padding:16px;border-radius:12px}nav{display:flex;gap:8px;margin:16px 0}button{flex:1;padding:12px;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere}details{padding:12px;border:1px solid #ccd5df;margin:8px 0}</style><header>BET ANALYST V3<h1>Moteur local expérimental</h1></header><p>Uniquement dossiers synthétiques enregistrés. Aucune conclusion sportive.</p><nav><button data-sport="football">Football</button><button data-sport="nba">NBA</button><button data-sport="tennis">Tennis</button></nav><p id="status" role="status"></p><main id="out"></main><script>
const statusNode=document.getElementById('status'),out=document.getElementById('out'),buttons=[...document.querySelectorAll('button')];
function add(tag,text,parent=out){const e=document.createElement(tag);e.textContent=text;parent.append(e);return e}
for(const b of buttons)b.onclick=async()=>{buttons.forEach(x=>x.disabled=true);out.replaceChildren();statusNode.textContent='Calcul local en cours';try{const res=await fetch('/report/'+b.dataset.sport,{cache:'no-store'});if(!res.ok)throw Error('Calcul refusé');const v=await res.json(),r=v.report,q=r.quick_summary;if(v.scope!=='DYNAMIC_REGISTERED_SYNTHETIC'||[v.registered_result,r,q].some(x=>!x||x.engine_access!==false||x.qualification!=='BLOCKED'||x.publication!=='BLOCKED')||q.sporting_conclusion!=='NOT_ESTABLISHED'||q.decision!=='NOT_ESTABLISHED'||q.dominant_trajectory!==null||r.sections.length!==7)throw Error('Verrous invalides');add('h2','Synthèse — '+b.textContent);add('p','Conclusion sportive non établie');add('p','Rapport synthétique généré localement');const d=add('details','');add('summary','Analyse approfondie',d);for(const s of r.sections){add('h3',s.title,d);add('pre',JSON.stringify(s,null,2),d)}const raw=add('details','');add('summary','Données originales',raw);add('pre',JSON.stringify(v,null,2),raw);statusNode.textContent='Calcul terminé'}catch(e){out.replaceChildren();statusNode.textContent=e.message}finally{buttons.forEach(x=>x.disabled=false)}};
</script></html>
