name: C3.5 experimental one-shot football collection
on:
  workflow_dispatch:
    inputs:
      competition:
        description: 'Approved competition code (example PL)'
        required: true
        default: 'PL'
        type: string
permissions:
  contents: read
jobs:
  collect:
    if: ${{ vars.PROVIDER_LICENSE_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate requested competition and required secret
        env:
          COMPETITION: ${{ inputs.competition }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          node --check c3-5-collect-once.mjs
          node -e "if (!/^[A-Z0-9]{2,8}$/.test(process.env.COMPETITION || '')) process.exit(1)"
          test -n "$FOOTBALL_DATA_TOKEN"
      - name: Collect one provider response (never scheduled)
        env:
          COMPETITION: ${{ inputs.competition }}
          PROVIDER_LICENSE_APPROVED: ${{ vars.PROVIDER_LICENSE_APPROVED }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node c3-5-collect-once.mjs
      - name: Keep snapshot as private workflow artifact only
        uses: actions/upload-artifact@v4
        with:
          name: c3-5-manual-snapshot
          path: c3-5-collected-matches.json
          retention-days: 1
