name: C3.5 experimental one-shot football collection
on:
  workflow_dispatch:
    inputs:
      competition:
        description: 'Approved competition code (example PL)'
        required: true
        default: 'PL'
        type: string
      confirmation:
        description: 'Type COLLECTER to explicitly authorize this single request'
        required: true
        type: string
permissions:
  contents: read
jobs:
  collect:
    if: ${{ inputs.confirmation == 'COLLECTER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout isolated experimental branch
        uses: actions/checkout@v4
        with:
          ref: c3-5-data-ingestion-candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate requested competition and required secret
        env:
          COMPETITION: ${{ inputs.competition }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ALLOWED_COMPETITIONS: ${{ vars.ALLOWED_COMPETITIONS }}
        run: |
          node --check c3-5-collect-once.mjs
          node -e "if (!/^[A-Z0-9]{2,8}$/.test(process.env.COMPETITION || '')) process.exit(1)"
          node -e "const a=(process.env.ALLOWED_COMPETITIONS||'').split(',').map(s=>s.trim());if(!a.includes(process.env.COMPETITION))process.exit(1)"
          test -n "$FOOTBALL_DATA_TOKEN"
      - name: Collect one provider response (never scheduled)
        env:
          COMPETITION: ${{ inputs.competition }}
          COLLECTION_CONFIRMATION: ${{ inputs.confirmation }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node c3-5-collect-once.mjs
      # No artifact publication, commit, or deployment.
