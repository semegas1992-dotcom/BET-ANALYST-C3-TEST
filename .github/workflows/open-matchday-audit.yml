name: Open Matchday five league audit
on:
  push:
    branches: [c3-nba-history]
    paths: ['.github/workflows/open-matchday-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s experimental -v
      - run: python experimental/open_matchday_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-matchday-audit
          path: open-matchday-audit.json
          retention-days: 1
