name: C3.3-B scenario coherence tests
on:
  push:
    branches: [c3-3-b-coherence-candidate]
  workflow_dispatch:
jobs:
  coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/c3-3-scenarios.test.cjs tests/c3-3-coherence.test.cjs
