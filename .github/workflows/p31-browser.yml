name: P31 isolated mobile browser
on:
  push:
    branches: [c3-nba-history]
    paths: ['experimental/pwa/p31/**','.github/workflows/p31-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/experimental/pwa/p31/ >/dev/null && break; sleep 1; done
          node experimental/pwa/p31/browser.cjs
