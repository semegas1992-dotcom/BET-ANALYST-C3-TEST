name: Football crosscheck v3
on:
  push:
    branches: [c3-nba-history]
    paths: ['.github/workflows/football-crosscheck.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s experimental -v
      - run: python experimental/football_crosscheck.py
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-crosscheck
          path: football-crosscheck.json
          retention-days: 1
