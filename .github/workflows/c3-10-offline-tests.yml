name: C3.10 offline regression tests
on:
  push:
    branches: [main]
    paths:
      - 'tests/c3-10-data-quality.test.cjs'
      - 'tests/c3-11-evidence.test.cjs'
      - 'tests/c3-11-interface.test.cjs'
      - 'tests/c3-12-evidence-link.test.cjs'
      - 'tests/c3-12-interface.test.cjs'
      - 'tests/c3-13-provenance.test.cjs'
      - 'tests/c3-13-interface.test.cjs'
      - 'tests/c3-13-classification.test.cjs'
      - 'tests/c3-14-diagnostic.test.cjs'
      - 'tests/c3-15-remediation.test.cjs'
      - 'tests/c3-16-preparation.test.cjs'
      - 'tests/c3-17-controlled-measures.test.cjs'
      - 'tests/c3-18-measure-quality.test.cjs'
      - 'tests/c3-19-synthetic-balance.test.cjs'
      - 'tests/c3-20-22-controls.test.cjs'
      - 'tests/c3-23-25-report.test.cjs'
      - 'tests/c3-26-28-gates.test.cjs'
      - 'tests/c3-29-31-contract.test.cjs'
      - 'tests/c3-32-34-descriptive.test.cjs'
      - 'tests/c3-35-37-indicators.test.cjs'
      - 'tests/c3-38-43-sheets.test.cjs'
      - 'tests/c3-44-49-sources.test.cjs'
      - 'tests/c3-50-59-intake.test.cjs'
      - 'preview-c3-7/**'
      - '.github/workflows/c3-10-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C3.10 offline tests
        run: node --test tests/c3-10-data-quality.test.cjs tests/c3-11-evidence.test.cjs tests/c3-11-interface.test.cjs tests/c3-12-evidence-link.test.cjs tests/c3-12-interface.test.cjs tests/c3-13-provenance.test.cjs tests/c3-13-interface.test.cjs tests/c3-13-classification.test.cjs tests/c3-14-diagnostic.test.cjs tests/c3-15-remediation.test.cjs tests/c3-16-preparation.test.cjs tests/c3-17-controlled-measures.test.cjs tests/c3-18-measure-quality.test.cjs tests/c3-19-synthetic-balance.test.cjs tests/c3-20-22-controls.test.cjs tests/c3-23-25-report.test.cjs tests/c3-26-28-gates.test.cjs tests/c3-29-31-contract.test.cjs tests/c3-32-34-descriptive.test.cjs tests/c3-35-37-indicators.test.cjs tests/c3-38-43-sheets.test.cjs tests/c3-44-49-sources.test.cjs tests/c3-50-59-intake.test.cjs
