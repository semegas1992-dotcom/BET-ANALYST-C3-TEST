name: Football enriched D0 v5
on:
  push:
    branches: [c3-nba-history]
    paths: ['.github/workflows/football-d0-enriched.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s experimental -v
      - run: python experimental/football_d0_enriched.py
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-d0-enriched
          path: football-d0-enriched.json
          retention-days: 1
