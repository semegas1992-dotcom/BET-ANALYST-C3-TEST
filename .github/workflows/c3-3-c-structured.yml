name: C3.3-C structured scenarios tests
on:
  push:
    branches: [c3-3-c-structured-candidate]
  workflow_dispatch:
jobs:
  structured:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/c3-3-scenarios.test.cjs tests/c3-3-coherence.test.cjs
