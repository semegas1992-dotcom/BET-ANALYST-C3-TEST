name: NBA history experimental
on:
  push:
    branches: [c3-nba-history]
    paths:
      - 'experimental/**'
      - '.github/workflows/nba-history-experimental.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s experimental -v
      - name: Collect historical data in quarantine
        env:
          BDL_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          WINDOW_HOURS: '24'
        run: python experimental/nba_batch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-batch-quarantine
          path: nba-batch-quarantine.json
          retention-days: 1
          if-no-files-found: warn
