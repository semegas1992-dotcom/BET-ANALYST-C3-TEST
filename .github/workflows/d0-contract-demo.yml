name: D0 contract synthetic pipeline
on:
  push:
    branches: [c3-nba-history]
    paths: ['experimental/export_kraft_report.py','experimental/kraft_report.py','experimental/test_kraft_report.py','experimental/d0_contract.py','experimental/football_pipeline_demo.py','experimental/test_d0_pipeline_demo.py','.github/workflows/d0-contract-demo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s experimental -v
      - run: python experimental/export_kraft_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: kraft-synthetic-report
          path: kraft-synthetic-report.json
          if-no-files-found: error
          retention-days: 7
