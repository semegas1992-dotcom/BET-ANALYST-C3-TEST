name: C3.5 ingestion foundation tests
on:
  push:
    branches: [c3-5-data-ingestion-candidate]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/c3-5-ingestion.test.cjs tests/c3-4-market-comparison.test.cjs tests/c3-3-scenarios.test.cjs tests/c3-3-coherence.test.cjs
