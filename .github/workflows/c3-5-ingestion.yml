name: C3.5 ingestion foundation tests
on:
  push:
    branches: [c3-5-data-ingestion-candidate]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check backend/c3-5-worker.mjs && node --check c3-5-provider.js && node --check c3-5-ingestion.js && node --check c3-5-snapshot.js && node --check c3-5-matches-view.js && node --check c3-6-match-status.js && node --check c3-5-snapshot-builder.js
      - name: Execute complete offline test suite with visible summary
        shell: bash
        run: |
          set -o pipefail
          echo '### BET ANALYST C3 — Offline validation' >> "$GITHUB_STEP_SUMMARY"
          set +e
          node --test --test-reporter=spec tests/c3-7-preview-safety.test.cjs tests/c3-6-match-status.test.cjs tests/c3-5-collect-once.test.cjs tests/c3-5-end-to-end-offline.test.cjs tests/c3-5-snapshot-builder.test.cjs tests/c3-5-preview.test.cjs tests/c3-5-matches-view.test.cjs tests/c3-5-snapshot.test.cjs tests/c3-5-worker.test.cjs tests/c3-5-provider.test.cjs tests/c3-5-ingestion.test.cjs tests/c3-4-market-comparison.test.cjs tests/c3-3-scenarios.test.cjs tests/c3-3-coherence.test.cjs 2>&1 | tee c3-offline-test-results.txt
          test_exit=${PIPESTATUS[0]}
          set -e
          if [ "$test_exit" -ne 0 ]; then
            echo '❌ Tests échoués — voir les logs' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '✅ Suite de tests terminée avec code de sortie 0. Résultats détaillés dans les logs (aucune donnée fournisseur).' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare isolated C3.5 preview artifact
        if: success()
        run: |
          mkdir -p c3-5-preview-package
          cp c3-5-preview.html c3-5-preview-package/index.html
          cp c3-5-matches-view.js c3-5-snapshot.js c3-6-match-status.js c3-5-preview-package/
      - name: Upload isolated preview package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: c3-5-preview-experimental
          path: c3-5-preview-package/
          retention-days: 7
