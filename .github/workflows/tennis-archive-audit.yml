name: Tennis pinned archive audit
on:
  workflow_dispatch:
  push:
    branches: [c3-nba-history]
    paths: ['experimental/tennis_archive_audit.py', '.github/workflows/tennis-archive-audit.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s experimental -v
      - run: |
          curl --fail --location --retry 2 --max-time 60 https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/83733587353df8a41f2fd4f516147d5aa83f5a8d/atp/atp_matches_2024.csv -o atp.csv
          curl --fail --location --retry 2 --max-time 60 https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/83733587353df8a41f2fd4f516147d5aa83f5a8d/wta/wta_matches_2024.csv -o wta.csv
          python experimental/tennis_archive_audit.py
          for tour in atp wta; do
            curl --fail --location --retry 2 --max-time 60 "https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/83733587353df8a41f2fd4f516147d5aa83f5a8d/${tour}/${tour}_matches_2024.csv" -o "${tour}.second.csv"
            sha256sum "${tour}.csv" "${tour}.second.csv"
          done
          python experimental/tennis_archive_verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: tennis-audit
          path: |
            tennis-audit.json
            tennis-verification.json
          retention-days: 1
