name: Open Matchday qualification
on:
  push:
    branches: [c3-nba-history]
    paths: ['.github/workflows/open-matchday-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s experimental -v
      - run: python experimental/open_matchday_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-matchday-probe
          path: open-matchday-probe.json
          retention-days: 1
