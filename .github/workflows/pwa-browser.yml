name: PWA Chromium offline integration
on:
  workflow_dispatch:
  push:
    branches: [c3-nba-history]
    paths: ['experimental/pwa/**','.github/workflows/pwa-browser.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 &
          node experimental/pwa/browser-replay.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: browser-offline-evidence
          path: browser-evidence.json
          retention-days: 14
