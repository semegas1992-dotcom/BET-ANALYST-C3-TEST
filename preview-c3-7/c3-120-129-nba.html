<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBA — C3.120–129</title><style>body{font:16px system-ui;max-width:680px;margin:auto;padding:16px}textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:12px}</style><h1>NBA — C3.120 à C3.129</h1><p>Import local uniquement. Données non vérifiées. Publication et moteur bloqués.</p><p><a href="https://www.balldontlie.io/terms.html">Conditions fournisseur, 20 octobre 2026 (§6 et §11)</a> : analyse personnelle permise, droits tiers non établis.</p><button id="test">Tester avec données fictives</button><label>Rapport JSON BALLDONTLIE<textarea id="raw" rows="5"></textarea></label><button id="load">Contrôler le rapport</button><p id="status"></p><label>Rencontre<select id="games" disabled></select></label><button id="prepare" disabled>Préparer le dossier local</button><pre id="out"></pre><script type="module">
const $=id=>document.getElementById(id);let games=[],report=null,synthetic=false;
const iso=v=>typeof v==='string'&&/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?(?:Z|[+-]\d\d:\d\d)$/.test(v)&&Number.isFinite(Date.parse(v));
const day=v=>typeof v==='string'&&/^\d{4}-\d\d-\d\d$/.test(v)&&Number.isFinite(Date.parse(v))&&new Date(v).toISOString().slice(0,10)===v;
function check(r,now){
if(!r||r.engine_access!==false||r.verification!=='NOT_PERFORMED'||r.publication!=='BLOCKED_RIGHTS_NOT_CONFIRMED'||r.status!=='QUARANTINE_UNVERIFIED'||!Array.isArray(r.games)||r.games.length>100||!iso(r.collected_at)||Date.parse(r.collected_at)>now||now-Date.parse(r.collected_at)>86400000)return [];
let u;try{u=new URL(r.source)}catch{return []}if(u.origin!=='https://api.balldontlie.io'||u.pathname!=='/v1/games')return [];
const counts=new Map();for(const g of r.games)if(g)counts.set(g.id,(counts.get(g.id)||0)+1);
return r.games.filter(g=>g&&Number.isSafeInteger(g.id)&&g.id>0&&counts.get(g.id)===1&&day(g.date)&&typeof g.home==='string'&&g.home.trim()&&g.home.length<=120&&typeof g.away==='string'&&g.away.trim()&&g.away.length<=120&&g.home!==g.away).map(g=>({id:g.id,date:g.date,home:g.home,away:g.away,status:typeof g.status==='string'?g.status:null,tipoff_utc:null,tipoff_paris:null,verified:false}));
}
function reset(){games=[];report=null;$('games').replaceChildren();$('games').disabled=true;$('prepare').disabled=true;$('out').textContent='';}
function load(r){reset();report=r;games=check(r,Date.now());$('status').textContent=games.length+' rencontres sélectionnables sur '+(Array.isArray(r?.games)?r.games.length:0)+' · horaires non confirmés · '+(r?.pagination_pending?'pagination incomplète':'exhaustivité non vérifiée');for(const g of games){const o=document.createElement('option');o.value=String(g.id);o.textContent=g.date+' · '+g.away+' @ '+g.home;$('games').append(o)}$('games').disabled=$('prepare').disabled=!games.length;}
$('load').onclick=()=>{synthetic=false;try{if($('raw').value.length>1000000)throw Error();load(JSON.parse($('raw').value))}catch{reset();$('status').textContent='Rapport invalide'}};
$('test').onclick=()=>{synthetic=true;const r={source:'https://api.balldontlie.io/v1/games',collected_at:new Date().toISOString(),engine_access:false,publication:'BLOCKED_RIGHTS_NOT_CONFIRMED',verification:'NOT_PERFORMED',status:'QUARANTINE_UNVERIFIED',games:[{id:1,date:'2026-11-24',home:'Equipe fictive A',away:'Equipe fictive B'}]};load(r);const ok=games.length===1&&check({...r,games:[...r.games,...r.games]},Date.now()).length===0&&check({...r,engine_access:true},Date.now()).length===0&&check({...r,collected_at:'2020-01-01T00:00:00Z'},Date.now()).length===0;$('status').textContent=(ok?'4/4 PASS':'FAIL')+' · démonstration fictive · moteur bloqué'};
$('prepare').onclick=()=>{const g=games.find(x=>String(x.id)===$('games').value);if(!g)return;$('out').textContent=JSON.stringify({schema:'BET_ANALYST_NBA_DOSSIER_DRAFT_V1',dataset_kind:synthetic?'SYNTHETIC':'REAL_UNVERIFIED',sport:'NBA',game:g,source:report.source,collected_at:report.collected_at,missing:['horaire confirmé','statut pré-match confirmé','vérification indépendante','forme','effectifs','statistiques collectives','statistiques individuelles'],readiness:'BLOCKED',engine_access:false,publication:'BLOCKED_RIGHTS_NOT_CONFIRMED'},null,2)};
</script></html>
